name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pull requests are compared with the base branch: protected paths, the test lock, the debt
      # baseline and coverage/UX floors may not be loosened without an ADR.
      - if: github.event_name == 'pull_request'
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm tsx harness/src/run-all.ts --with-coverage --base origin/${{ github.base_ref }}
      - if: github.event_name != 'pull_request'
        run: pnpm check
