name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make setup
      # Pull requests are compared with the base branch: protected paths, test lock, debt baseline
      # and coverage floors may not be loosened without an ADR.
      - if: github.event_name == 'pull_request'
        run: make check BASE=origin/${{ github.base_ref }}
      - if: github.event_name != 'pull_request'
        run: make check
