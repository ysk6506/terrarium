name: entropy
# Weekly: docs expire by age and debt comes due even when nobody pushes. A red run here is the alarm.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  gc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx harness/src/run-all.ts
