name: entropy
# Weekly: docs expire by age and debt comes due even when nobody pushes. A red run here is the alarm.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  gc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make setup
      - run: python -m harness.run_all
