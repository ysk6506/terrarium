[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrarium"
version = "0.1.0"
description = "Stateful IT infrastructure simulator for evaluating agents and harnesses"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6,<7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "falkordb>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "mutmut>=3",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["terrarium*", "harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src", "."]
markers = [
  "req(id): links a test to a requirement id in docs/product-specs/requirements.md",
]

[tool.coverage.run]
branch = true
source = ["src/terrarium", "harness"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "T20", "PL", "RUF"]
ignore = ["PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "E501", "PLC0415"]
"harness/**" = ["T20", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
