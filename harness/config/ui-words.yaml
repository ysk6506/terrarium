# One vocabulary on every screen (ADR-0183). Enforced by harness/src/checks/ui-words.ts (WORD001).
# Protected path: change only with an accepted ADR.
#
# The check reads the string literals, template text, JSX text and Korean field names of the non-test source files
# under scan_dirs. Each rule names an old word (a regular expression) and the word to write instead. An exception is
# either an exact phrase or a path glob, and always carries the reason it may stay. Keep patterns narrow: a rule that
# fires on ordinary prose is worse than no rule.
scan_dirs: [apps/web/src, apps/server/src, packages/core/src]

rules:
  - id: count-hoe
    # "회" as a counting word: "3회", "${n}회", "회 중", "5회째", "회차". A Hangul letter on either side means a
    # longer word (회사, 회색, 개회), so those never match.
    pattern: '(?<![가-힣])회(?![가-힣])|회째|회차'
    use: '"번" ("3번", "3번째")'

  - id: count-times
    pattern: '횟수'
    use: '"몇 번" or "부른 수" (rewrite the sentence)'
    allow:
      - path: apps/web/src/moss/registry-experiment.ts
        phrase: 횟수
        reason: 이끼 still understands the old word when a person types it ("횟수 5번으로 정해 줘"). It is a word to match, never shown.

  - id: seed
    pattern: '시드'
    use: '"상황" (for the number that rebuilds a world: "다시 만들기 번호")'

  - id: entity
    pattern: '개체'
    use: '"객체"'

  - id: relation-noun
    # Only the model-noun phrases found in the product. The bare word "관계" stays (관계없이, 냉방 관계가 없는).
    pattern: '관계 (?:종류|타입|잇기|정의)|라벨·관계|관계를 (?:잇|만들|그어)'
    use: '"링크" ("링크 종류", "링크 잇기")'

  - id: escalation
    # The glossary retires "에스컬레이션" for "넘기기" (the result is "넘긴 일"). The tool name `escalate` is English
    # and is not matched.
    pattern: '에스컬레이션'
    use: '"넘기기" or "넘긴 일"'

  - id: e2e-heading
    pattern: 'E2E로 가려면'
    use: '"세계 범위" (the tab) or "이 세계에 필요한 액션" (the heading)'
