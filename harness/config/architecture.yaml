# Architecture contract. Enforced by harness/src/checks/architecture.ts (REQ-021, ADR-0011).
# Protected path: change only with an accepted ADR that lists it in touches_protected.
#
# A *unit* is a folder. A file belongs to the first unit (in this order) whose path contains it.
# A unit may import only the units in may_import ("core.*" = every unit whose name starts "core.").
# Other units are reached only through their index.ts (or the @terrarium/core/<path> alias).
units:
  core.kernel:              {path: packages/core/src/kernel, may_import: []}
  core.llm:                 {path: packages/core/src/llm, may_import: []}
  core.ranking:             {path: packages/core/src/ranking, may_import: []}
  core.spatial:             {path: packages/core/src/spatial, may_import: [core.kernel]}
  core.catalog:             {path: packages/core/src/catalog, may_import: [core.kernel]}
  core.physics.slots:       {path: packages/core/src/physics/slots, may_import: [core.kernel]}
  core.world:               {path: packages/core/src/world, may_import: [core.kernel, core.spatial, core.catalog, core.physics.slots]}
  core.profiles:            {path: packages/core/src/profiles, may_import: [core.kernel, core.catalog]}
  core.physics:             {path: packages/core/src/physics, may_import: [core.kernel, core.spatial, core.catalog, core.world, core.physics.slots]}
  core.topology:            {path: packages/core/src/topology, may_import: [core.kernel, core.catalog, core.world, core.physics]}
  core.facades:             {path: packages/core/src/facades, may_import: [core.kernel, core.catalog, core.profiles, core.world]}
  core.tools:               {path: packages/core/src/tools, may_import: [core.kernel, core.catalog, core.world, core.facades]}
  core.scenario:            {path: packages/core/src/scenario, may_import: [core.kernel, core.catalog, core.world, core.physics, core.tools]}
  core.oracle:              {path: packages/core/src/oracle, may_import: [core.kernel, core.world, core.scenario]}
  core.sources.worldgen:    {path: packages/core/src/sources/worldgen, may_import: [core.kernel, core.spatial, core.catalog, core.world, core.sources]}
  core.sources:             {path: packages/core/src/sources, may_import: [core.kernel, core.spatial, core.catalog, core.world]}
  core.session:             {path: packages/core/src/session, may_import: [core.kernel, core.spatial, core.catalog, core.world, core.profiles, core.physics, core.physics.slots, core.facades, core.tools, core.scenario, core.oracle, core.sources]}
  core.experiments:         {path: packages/core/src/experiments, may_import: [core.kernel, core.catalog, core.world, core.physics.slots, core.tools, core.scenario, core.oracle, core.session, core.ranking]}
  core.analysis:            {path: packages/core/src/analysis, may_import: [core.kernel, core.world, core.tools, core.scenario, core.oracle, core.session, core.experiments]}
  core.contract:            {path: packages/core/src/contract, may_import: [core.kernel, core.spatial, core.catalog, core.world, core.physics.slots, core.profiles, core.tools, core.scenario, core.oracle, core.session, core.sources, core.sources.worldgen, core.experiments, core.analysis, core.llm]}
  server.adapters:          {path: apps/server/src/adapters, may_import: ["core.*"]}
  server.shell:             {path: apps/server/src/shell, may_import: ["core.*"]}
  server.runtime:           {path: apps/server/src/runtime, may_import: ["core.*", server.adapters, server.shell]}
  server.cluster:           {path: apps/server/src/cluster, may_import: ["core.*", server.runtime]}
  server.mcp:               {path: apps/server/src/mcp, may_import: ["core.*", server.runtime]}
  server.http:              {path: apps/server/src/http, may_import: ["core.*", server.adapters, server.runtime, server.mcp]}
  server.main:              {path: apps/server/src, may_import: ["core.*", "server.*"], public_index: false}
  web.logic:                {path: apps/web/src/logic, may_import: ["core.*"]}
  web.moss:                 {path: apps/web/src/moss, may_import: ["core.*", web.logic]}
  web.ui:                   {path: apps/web/src/ui, may_import: ["core.*", web.logic, web.moss]}
  web.main:                 {path: apps/web/src, may_import: ["core.*", "web.*"], public_index: false}
  harness:                  {path: harness/src, may_import: [], public_index: false}
  tests.spec:               {path: tests/spec, may_import: ["core.*", "server.*", tests.e2e], public_index: false}
  tests.e2e:                {path: tests/e2e, may_import: ["core.*"], public_index: false}

# Only these units may import Node built-ins (core and web must run in a browser).
node_builtins: ["server.*", harness, "tests.*"]

# Third-party package -> units allowed to import it. Unknown packages are errors (ARCH020):
# adding a dependency is a decision and needs an ADR plus an entry here.
third_party:
  zod: ["core.*", "server.*", "web.*"]
  fastify: [server.http, server.cluster]
  "@fastify/static": [server.http]
  "@modelcontextprotocol/sdk": [server.mcp, server.adapters]
  react: [web.ui, web.moss, web.main]
  react-dom: [web.ui, web.main]
  "@xyflow/react": [web.ui]
  three: [web.ui]
  typescript: [harness]
  yaml: [harness]
  playwright: [tests.e2e, harness]
  "@axe-core/playwright": [tests.e2e, harness]
  ajv: [tests.spec]
  ajv-formats: [tests.spec]

# Packages only test code (*.test.ts, test-support/) may import.
test_only: [vitest, fast-check]

# Code that may read the wall clock or global randomness (REQ-001, ADR-0006).
nondeterminism_allowed: [packages/core/src/kernel/entropy.ts, apps/, harness/, tests/]

source_roots: [packages, apps, harness/src, tests/spec, tests/e2e]
alias_prefix: "@terrarium/core/"
alias_target: packages/core/src

# Files under source_roots that belong to no unit on purpose (tool configuration).
ignored_files: [apps/web/vite.config.ts]
