# Technical debt contract. Enforced by harness/checks/debt.py (REQ-022).
# Protected path: change only with an accepted ADR.
register: docs/exec-plans/tech-debt.yaml
baseline: harness/config/debt-baseline.json
marker_dirs: [src, tests, harness]      # TODO/FIXME/HACK/XXX comments here must cite a debt id
quality_dirs: [src, harness]            # size/complexity limits apply here
markers: [TODO, FIXME, HACK, XXX]

# Open-debt budget: going over means "pay down before adding more".
max_open: 12
max_open_high: 2

# Size and complexity limits. Existing violations may only be tolerated through the ratchet baseline
# or an inline `# debt-ok: TD-NNNN` waiver that points at an open register item.
limits:
  max_file_lines: 500
  max_function_lines: 80
  max_complexity: 12
  max_params: 8
