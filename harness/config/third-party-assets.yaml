# Third-party material that is not an npm package and ships in the repository. harness/src/checks/licenses.ts
# reads this to write THIRD_PARTY_NOTICES.md. Add an entry when material from outside is copied in (ADR-0185).
# Fields: id, name, version, license (SPDX), source (URL), where (what the notice says it is used for),
# paths (files in this repository), license_file (a copy of the license text in this repository), copyright.
assets:
  - id: dmtf-redfish-schemas
    name: DMTF Redfish JSON schemas
    version: Redfish-Publications commit fa6d23d9709a, 2026-10-13
    license: BSD-3-Clause
    source: https://github.com/DMTF/Redfish-Publications
    where: 시험용 스키마 묶음 (tests/spec/redfish-schemas)
    paths:
      - tests/spec/redfish-schemas/dmtf-schemas.json.gz
    license_file: tests/spec/redfish-schemas/LICENSE-DMTF.md
    copyright: >-
      Copyright 2014-2026 DMTF. For the full DMTF copyright policy, see
      http://www.dmtf.org/about/policies/copyright
  - id: mvdan-sh
    name: mvdan/sh (셸 해석기)
    version: v3.14.1, 패치 포함
    license: BSD-3-Clause
    source: https://github.com/mvdan/sh
    where: 셸과 awk를 돌리는 WebAssembly 묶음 (apps/server/shell-wasm, 서버에서만 쓰고 웹 번들에는 없어요)
    paths:
      - apps/server/shell-wasm/bin/terrarium-sh.wasm
    license_file: apps/server/shell-wasm/licenses/LICENSE-mvdan-sh
    copyright: >-
      Copyright (c) 2016, Daniel Martí. All rights reserved.
  - id: goawk
    name: GoAWK (awk 해석기)
    version: v1.32.0, 패치 포함
    license: MIT
    source: https://github.com/benhoyt/goawk
    where: 셸과 awk를 돌리는 WebAssembly 묶음 (apps/server/shell-wasm, 서버에서만 쓰고 웹 번들에는 없어요)
    paths:
      - apps/server/shell-wasm/bin/terrarium-sh.wasm
    license_file: apps/server/shell-wasm/licenses/LICENSE-goawk
    copyright: >-
      Copyright (c) 2022 Ben Hoyt
  - id: go-stdlib
    name: Go 표준 라이브러리 (WebAssembly에 들어가요)
    version: go1.26.11
    license: BSD-3-Clause
    source: https://github.com/golang/go
    where: 셸과 awk를 돌리는 WebAssembly 묶음 (apps/server/shell-wasm, 서버에서만 쓰고 웹 번들에는 없어요)
    paths:
      - apps/server/shell-wasm/bin/terrarium-sh.wasm
    license_file: apps/server/shell-wasm/licenses/LICENSE-go
    copyright: >-
      Copyright 2009 The Go Authors.
  - id: golang-x-sys
    name: golang.org/x/sys
    version: v0.47.0
    license: BSD-3-Clause
    source: https://github.com/golang/sys
    where: 셸과 awk를 돌리는 WebAssembly 묶음 (apps/server/shell-wasm, 서버에서만 쓰고 웹 번들에는 없어요)
    paths:
      - apps/server/shell-wasm/bin/terrarium-sh.wasm
    license_file: apps/server/shell-wasm/licenses/LICENSE-x-sys
    copyright: >-
      Copyright 2009 The Go Authors.
  - id: golang-x-term
    name: golang.org/x/term
    version: v0.45.0
    license: BSD-3-Clause
    source: https://github.com/golang/term
    where: 셸과 awk를 돌리는 WebAssembly 묶음 (apps/server/shell-wasm, 서버에서만 쓰고 웹 번들에는 없어요)
    paths:
      - apps/server/shell-wasm/bin/terrarium-sh.wasm
    license_file: apps/server/shell-wasm/licenses/LICENSE-x-term
    copyright: >-
      Copyright 2009 The Go Authors.

# Data drawn by hand with outside material as a guide. Nothing is copied, so no license applies; the notices
# file says so in a section of its own. Say only what is known; do not add who gave it or which service it was.
references:
  - id: site-presets
    name: 사업장 프리셋의 부지 외곽선과 건물 위치
    paths:
      - packages/core/src/sources/worldgen/sites.ts
    text: >-
      사업장 프리셋의 부지 외곽선과 건물 위치는 인터넷에 공개된 자료(공개 지도와 보도 자료의 조감도)를 참고해 손으로 그린
      근사치예요(5 m 단위로 반올림). 지도 서비스의 데이터나 타일을 복사해 담지 않았어요.
